<style>

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f6e6da; --ink-soft: #d9bfae; --bg-top: #2a211d; --bg-bot: #3a2621;
      --card: #33281f; --pink: #ff8a9b; --pink-soft: #4a2c30; --line: rgba(246,230,218,.18);

  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);

  .logo { width: min(100%, 26rem); height: auto; display: block; }
  .tagline { font-size: 1.15rem; color: var(--ink-soft); margin: 1rem 0 1.25rem; max-width: 32rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; margin: 0 0 1.5rem; list-style: none; }
  .chips li { background: var(--card); border: 2px solid var(--pink); border-radius: 999px; padding: .2rem .9rem; font-weight: 700; font-size: .95rem; }
  .stores { display: flex; flex-wrap: wrap; gap: .75rem; }
  .stores a {

  .stores a:hover { filter: brightness(1.15); }
  .stores svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }
  .free { font-size: .85rem; color: var(--ink-soft); margin-top: .6rem; }
  video { width: min(100%, 22rem); aspect-ratio: 9 / 16; border-radius: 28px; display: block; margin: 0 auto;

  .about { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 1.25rem 1.4rem; white-space: pre-line; }

}, "shots": "スクリーンショット", "cuts": ["玄関に置かれた子ねこ ママとパパをさがしてあげて！", "顔そのものが手がかり！", "町じゅうをさがそう", "わたしだけのシェルター", "たのしいあそびの時間", "世界にひとつだけの顔", "思い出はアルバムに"], "about": "シェルターの玄関に、子ねこが置かれていた。名札も、手紙もない。\n残された手がかりは、その顔だけ ― 折れた耳、片方だけ青い目、指が一本多い前足。\n\n子ねこの顔から両親の面影を読み取り、町をさがして本当の親を見つけ出す、ねこの保護シェルターゲームです。", "privacy": ["../en.html", "../delete_en.html"]}, "es": {"label": "Español", "html": "es", "name": "¿De quién es el gatito?", "promo": "Lee la cara de un gatito y recorre el pueblo para encontrar a sus verdaderos padres. Un acogedor juego de refugio de gatos basado en genética real.", "chips": ["Genética real", "Sin gacha", "Refugio acogedor"], "ui": {"ios": "Descargar en el App Store", "android": "Disponible en Google Play", "free": "Gratis · Compras dentro de la app", "privacy": "Política de privacidad", "delete": "Eliminar cuenta y datos", "contact": "Contacto"}, "shots": "Capturas", "cuts": ["Un gatito en tu puerta. ¡Ayúdale a encontrar a sus padres!", "¡Cada cara es una pista!", "Explora todo el pueblo", "Tu propio refugio", "¡Hora de jugar!", "No hay dos caras iguales", "Guarda cada recuerdo"], "about": "Alguien ha dejado un gatito en la puerta de tu refugio. Sin collar, sin nota.\nLa única pista es su cara: una oreja doblada, un ojo azul, una pata con un dedo de más.\n\nLee a los padres en la cara del gatito y recorre el pueblo para encontrarlos. Un juego de refugio de gatos basado en genética real.", "privacy": ["../en.html", "../delete_en.html"]}, "zh_Hans": {"label": "简体中文", "html": "zh-Hans", "name": "谁家的小猫咪？", "promo": "从小猫的脸上读出它的父母。靠藏在毛色、耳朵、眼睛和尾巴里的遗传线索，走遍小镇找到真正的爸爸妈妈——一款治愈系推理收容所游戏。", "chips": ["真实遗传推理", "没有抽卡", "治愈收容所"], "ui": {"ios": "在 App Store 下载", "android": "在 Google Play 下载", "free": "免费 · 含应用内购买", "privacy": "隐私政策", "delete": "删除账号与数据", "contact": "联系我们"}, "shots": "游戏画面", "cuts": ["门口来了一只小猫 帮它找到爸爸妈妈吧！", "脸就是线索！", "走遍整个小镇", "我的猫咪收容所", "快乐的游戏时间", "独一无二的脸", "回忆留在相册里"], "about": "收容所门口被放了一只小猫。没有名牌，也没有字条。\n唯一的线索就是它的脸——折起的耳朵、只有一只是蓝色的眼睛、多一根脚趾的前爪。\n\n从小猫的脸上读出父母的影子，走遍小镇找到它真正的爸爸妈妈。这是一款猫咪收容所游戏。", "privacy": ["../en.html", "../delete_en.html"]}, "zh_Hant": {"label": "繁體中文", "html": "zh-Hant", "name": "誰家的小貓咪？", "promo": "從小貓的臉上讀出牠的父母。靠藏在毛色、耳朵、眼睛和尾巴裡的遺傳線索，走遍小鎮找到真正的爸爸媽媽——一款療癒系推理收容所遊戲。", "chips": ["真實遺傳推理", "沒有抽卡", "療癒收容所"], "ui": {"ios": "在 App Store 下載", "android": "在 Google Play 下載", "free": "免費 · 含 App 內購買", "privacy": "隱私權政策", "delete": "刪除帳號與資料", "contact": "聯絡我們"}, "shots": "遊戲畫面", "cuts": ["門口來了一隻小貓 幫牠找到爸爸媽媽吧！", "臉就是線索！", "走遍整個小鎮", "我的貓咪收容所", "快樂的遊戲時間", "獨一無二的臉", "回憶留在相簿裡"], "about": "收容所門口被放了一隻小貓。沒有名牌，也沒有字條。\n唯一的線索就是牠的臉——摺起的耳朵、只有一隻是藍色的眼睛、多一根腳趾的前爪。\n\n從小貓的臉上讀出父母的影子，走遍小鎮找到牠真正的爸爸媽媽。這是一款貓咪收容所遊戲。", "privacy": ["../en.html", "../delete_en.html"]}};
const ORDER = ["ko", "en", "ja", "es", "zh_Hans", "zh_Hant"];
function pick() {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q && DATA[q]) return q;
  } catch (e) {}
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const s = l.toLowerCase();
    if (s.startsWith("zh")) return /(hant|tw|hk|mo)/.test(s) ? "zh_Hant" : "zh_Hans";
    const b = s.split("-")[0];
    if (DATA[b]) return b;
  }
  return "en";
}
function render(lang) {
  const d = DATA[lang];
  document.documentElement.lang = d.html;
  document.title = d.name + " · Whose Kitten?";
  const $ = id => document.getElementById(id);
  $("logo").src = "img/logo_" + lang + ".webp"; $("logo").alt = d.name;
  $("tagline").textContent = d.promo;
  $("chips").replaceChildren(...d.chips.map(c => Object.assign(document.createElement("li"), {textContent: c})));
  $("ios").querySelector("span").textContent = d.ui.ios;
  $("android").querySelector("span").textContent = d.ui.android;
  $("free").textContent = d.ui.free;
  $("shots-title").textContent = d.shots;
  $("about-title").textContent = d.name;
  $("about").textContent = d.about;
  $("gallery").replaceChildren(...d.cuts.map((c, i) => {
    const f = document.createElement("figure");
    const img = Object.assign(document.createElement("img"),
      {src: "img/" + lang + "_" + String(i + 1).padStart(2, "0") + ".webp", alt: c, loading: "lazy", width: 540, height: 1200});
    f.append(img, Object.assign(document.createElement("figcaption"), {textContent: c}));
    return f;
  }));
  $("privacy").textContent = d.ui.privacy; $("privacy").href = d.privacy[0];
  $("delete").textContent = d.ui.delete; $("delete").href = d.privacy[1];
  $("contact").textContent = d.ui.contact;
  for (const b of $("langs").children) b.setAttribute("aria-pressed", b.dataset.lang === lang);
}
document.getElementById("langs").replaceChildren(...ORDER.map(l => {
  const b = Object.assign(document.createElement("button"), {textContent: DATA[l].label});
  b.dataset.lang = l;
  b.onclick = () => { render(l); try { history.replaceState(null, "", "?lang=" + l); } catch (e) {} };
  return b;
}));
render(pick());
</script>
